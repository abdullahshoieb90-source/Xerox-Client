name: Build Xelo Client APK

on:
  workflow_dispatch:
  push:
    branches: [master, develop, 'arena/**']
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check pinned Android SDK components
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and build the original Android app
        shell: bash
        run: |
          log="$RUNNER_TEMP/xelo-build.log"
          if ! ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain 2>&1 | tee "$log"; then
            python3 - "$log" <<'PYTHON'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          at = next((i for i, line in enumerate(lines) if line.startswith("* What went wrong:")), len(lines) - 10)
          excerpt = [line for line in lines if "error:" in line or line.startswith("e: ")][:20]
          message = "\n".join(excerpt + lines[max(0, at):at+10])[:6000]
          print("::error title=Xelo Android build failed::" + message.replace("%", "%25").replace("\n", "%0A").replace("\r", "%0D"))
          PYTHON
            exit 1
          fi

      - name: Verify signed APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          aapt_output=$("$tools/aapt" dump badging "$apk")
          grep -q "^package: name='com.origin.launcher.beta'" <<< "$aapt_output"
          sha256sum "$apk"

      - uses: actions/upload-artifact@v5
        with:
          name: xelo-client-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xelo-client-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
