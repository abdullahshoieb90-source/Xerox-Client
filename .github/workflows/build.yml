name: Build Xelo Client APK

on:
  workflow_dispatch:
  push:
    branches: [master, develop, 'arena/**']
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build the original Android app
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify signed APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          aapt_output=$("$tools/aapt" dump badging "$apk")
          grep -q "^package: name='com.origin.launcher.beta'" <<< "$aapt_output"
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: xelo-client-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xelo-client-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
