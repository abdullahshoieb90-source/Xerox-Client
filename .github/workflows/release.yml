name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: false
        type: boolean
      publish_debug_run_id:
        description: 'Successful Xelo debug workflow run ID to publish as a test APK'
        required: false
        default: ''
        type: string

jobs:
  release-build:
    if: inputs.publish_debug_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check pinned Android SDK components
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List Release APK files
        run: |
          echo "Release APK files generated:"
          find app/build/outputs/apk/release -name "*.apk" -type f || echo "No APK files found"
          echo "APK sizes:"
          ls -lh app/build/outputs/apk/release/*.apk || echo "No APK files to show size for"

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            APK_SIZE=$(stat -c%s "$APK_PATH")
            APK_SIZE_MB=$((APK_SIZE / 1024 / 1024))
            APK_NAME=$(basename "$APK_PATH")
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_size_mb=$APK_SIZE_MB" >> $GITHUB_OUTPUT
            echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: origin-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload Release Test Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-test-results-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Mapping Files
        uses: actions/upload-artifact@v5
        with:
          name: release-mapping-${{ github.run_number }}
          path: |
            app/build/outputs/mapping/release/
            app/build/outputs/native-debug-symbols/release/
          retention-days: 365
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Origin Launcher ${{ github.run_number }}
          body: |
            ## Origin Launcher Release (Build ${{ github.run_number }})
            
            ### 📱 APK Information
            - **File**: ${{ steps.apk_info.outputs.apk_name }}
            - **Size**: ~${{ steps.apk_info.outputs.apk_size_mb }} MB
            - **Build**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            
            ### 🔧 Installation
            1. Download the APK file below
            2. Enable "Unknown Sources" in Android settings
            3. Install the APK
            
            ### ⚠️ Note
            This is a release build. Make sure to uninstall any previous debug versions.
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: "v${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-android-test:
    if: inputs.publish_debug_run_id != '' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Promote the verified Xelo debug APK to a direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.publish_debug_run_id }}
        run: |
          if [[ ! "$SOURCE_RUN" =~ ^[0-9]+$ ]]; then
            echo '::error::Enter a numeric GitHub Actions run ID.'
            exit 1
          fi
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          source_sha=$(jq -er --arg repo "$GITHUB_REPOSITORY" --arg branch "$GITHUB_REF_NAME" '
            select(.status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/build.yml"
              and (.event == "push" or .event == "workflow_dispatch")
              and .head_repository.full_name == $repo and .head_branch == $branch)
            | .head_sha
          ' <<< "$run")
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$source_sha" "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs" | jq -e '
            any(.jobs[]; .name == "debug-build" and .conclusion == "success"
              and any(.steps[]; .name == "Verify signed APK" and .conclusion == "success"))
          '

          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name xelo-client-debug --dir "$out"
          apk="$out/xelo-client-android-test.apk"
          mv "$out/app-debug.apk" "$apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify "$apk"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -q "^package: name='com.origin.launcher.beta'" <<< "$badging"
          digest=$(sha256sum "$apk" | cut -d ' ' -f 1)

          tag="xelo-android-test-${source_sha:0:12}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$source_sha"
          fi
          cat > "$out/notes.md" <<NOTES
          Signed debug APK from the original Xelo Client Android app, not Companion.
          Download **xelo-client-android-test.apk** directly. No ZIP extraction is needed.

          This is a test build, not a stable release or proof that all modules work on Bedrock.
          Three resource-pack modules are available to try on Android Bedrock 26.62 (1.26.62.1).
          Touch Modules are preview-only and do not run in the game in this build.
          Do not uninstall Minecraft to install Xelo.

          Verified build: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN
          Source commit: $source_sha
          APK SHA-256: $digest
          NOTES
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --title 'Xelo Client – Android test APK' --notes-file "$out/notes.md" --prerelease --latest=false
