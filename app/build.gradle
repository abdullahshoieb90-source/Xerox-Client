plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.origin.launcher'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.origin.launcher'
        minSdk 26
        targetSdk 36
        versionCode 17
        versionName '1.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Keep the old runtime sources in the repository, but do not package its game libraries.
    sourceSets {
        main {
            jniLibs.srcDirs = []
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                    'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0',
                    'META-INF/LGPL2.1', 'META-INF/ASL2.0', 'META-INF/INDEX.LIST'
            ]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

dependencies {
    implementation libs.androidx.preference.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.androidx.fragment.ktx
    implementation libs.material
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation libs.gson
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
